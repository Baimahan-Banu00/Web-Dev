<div class="login-container">
  <div class="login-card">
    <h2>🍕 Food Delivery</h2>
    <h3>Регистрация</h3>

    <div *ngIf="error" class="error">{{ error }}</div>

    <input
      type="text"
      placeholder="Логин"
      [(ngModel)]="username"
      class="input"
    />

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
      class="input"
    />

    <input
      type="password"
      placeholder="Пароль"
      [(ngModel)]="password"
      class="input"
    />

    <button (click)="onRegister()" class="btn">Зарегистрироваться</button>

    <p>Уже есть аккаунт? <a routerLink="/login">Войти</a></p>
  </div>
</div>
