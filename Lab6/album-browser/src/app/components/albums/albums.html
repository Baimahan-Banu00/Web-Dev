<h2>Albums</h2>

<div *ngIf="loading">Loading...</div>
<div *ngIf="!loading && error">{{ error }}</div>

<ul *ngIf="!loading && !error && albums.length > 0">
  <li *ngFor="let album of albums" style="margin-bottom: 8px;">
    <a [routerLink]="['/albums', album.id]">
      {{ album.id }} — {{ album.title }}
    </a>
    <button style="margin-left: 10px;" (click)="deleteAlbum(album.id)">
      Delete
    </button>
  </li>
</ul>

<div *ngIf="!loading && !error && albums.length === 0">
  No albums
</div>
